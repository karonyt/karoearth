<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=https://site.karoearth.xyz">
  <link rel="canonical" href="https://site.karoearth.xyz">
</head>
<body>
  <p>Redirecting to <a href="https://site.karoearth.xyz">site.karoearth.xyz</a>…</p>
  <script>
    (function(){
      var target = "https://site.karoearth.xyz";
      try { location.replace(target); } catch(e) { location.href = target; }
    })();
  </script>
</body>
</html>
